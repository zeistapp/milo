name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check GitHub Actions workflows
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun run lint:ci
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      # Consumers on @main run this install path next, so exercise it before any merge.
      - name: Validate reusable action
        uses: ./
        with:
          action: validate
          config: examples/ecosystem.json
          self-repo: ${{ github.repository }}
          claude-version: '2.1.296'
      - run: claude --version && cd "$RUNNER_TEMP" && pnpm --version && yarn --version
