name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A new push to a PR cancels its older run. Main keeps every run: it is the only check of merged PRs together.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check GitHub Actions workflows
        # The same script the action's check mode runs on consumers' workflows.
        run: scripts/actionlint.sh
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      # Consumers on @main run this install path next, so exercise it before any merge.
      # It runs first because it installs the sandbox the tests' setup and check steps need.
      - name: Validate reusable action
        uses: ./
        with:
          action: validate
          config: examples/ecosystem.json
          self-repo: ${{ github.repository }}
          claude-version: '2.1.296'
      - run: bun run lint:ci
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: claude --version && cd "$RUNNER_TEMP" && pnpm --version && yarn --version
