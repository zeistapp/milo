name: Milo consumer
on:
  workflow_call:
    inputs:
      config:
        type: string
        default: milo.config.json
    secrets:
      MILO_GITHUB_TOKEN:
        required: false
      MILO_APP_PRIVATE_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
permissions:
  contents: read
jobs:
  tasks:
    uses: zeistapp/milo/.github/workflows/maintenance.yml@main
    secrets:
      MILO_GITHUB_TOKEN: ${{ secrets.MILO_GITHUB_TOKEN }}
      MILO_APP_PRIVATE_KEY: ${{ secrets.MILO_APP_PRIVATE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    # Every run works the oldest approved ticket, then scans each category not yet scanned today.
    # CEILING: one job runs the ticket and every due scan in turn, so a slow day can hit the job timeout;
    # unfinished scans resume on the next run. Split scans into a matrix if that happens often.
    with:
      action: task
      period: day
      config: ${{ inputs.config }}
  reviews:
    uses: zeistapp/milo/.github/workflows/maintenance.yml@main
    secrets:
      MILO_GITHUB_TOKEN: ${{ secrets.MILO_GITHUB_TOKEN }}
      MILO_APP_PRIVATE_KEY: ${{ secrets.MILO_APP_PRIVATE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    with:
      action: reviews
      config: ${{ inputs.config }}
