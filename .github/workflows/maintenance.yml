name: Maintenance runner
on:
  workflow_call:
    inputs:
      action:
        type: string
        default: task
      category:
        type: string
        default: ""
      period:
        type: string
        default: week
      repo:
        type: string
        default: ""
      number:
        type: string
        default: ""
      config:
        type: string
        default: milo.config.json
      include-self:
        type: boolean
        default: true
    secrets:
      MILO_GITHUB_TOKEN:
        required: false
      MILO_APP_PRIVATE_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
permissions:
  contents: read
jobs:
  run:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: maintenance
    concurrency:
      group: milo-${{ github.repository }}-${{ contains(fromJSON('["reviews","review","revise"]'), inputs.action) && 'reviews' || inputs.category || inputs.action }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A GitHub App gives Milo its own bot identity; without one Milo acts as MILO_GITHUB_TOKEN's owner.
      # CEILING: the token covers the calling repo's owner and lasts one hour, so other owners' targets
      # and a longer run fail until the next run. Mint a token per owner, or refresh it in the CLI, if that bites.
      - name: Create GitHub App token
        id: app
        if: vars.MILO_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MILO_APP_CLIENT_ID }}
          private-key: ${{ secrets.MILO_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Validate credentials and agent version for the configured provider
        id: preflight
        env:
          CONFIG: ${{ inputs.config }}
          # Live-verified Claude Code release; set CLAUDE_VERSION to pin your own.
          DEFAULT_CLAUDE_VERSION: "2.1.296"
          CLAUDE_VERSION: ${{ vars.CLAUDE_VERSION }}
          MILO_GITHUB_TOKEN: ${{ steps.app.outputs.token || secrets.MILO_GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          provider=$(jq -r '.agent.provider // "custom"' "$CONFIG") || { echo "Cannot read agent.provider from $CONFIG"; exit 1; }
          test -n "$MILO_GITHUB_TOKEN" || { echo 'Add MILO_GITHUB_TOKEN, or MILO_APP_CLIENT_ID and MILO_APP_PRIVATE_KEY, to the maintenance environment and pass the secret from milo.yml'; exit 1; }
          case "$provider" in
            claude)
              test -n "$ANTHROPIC_API_KEY" || { echo 'Add ANTHROPIC_API_KEY to the maintenance environment'; exit 1; }
              echo "claude-version=${CLAUDE_VERSION:-$DEFAULT_CLAUDE_VERSION}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Run Milo
        # Published action, so consumers calling this workflow run Milo rather than their own checkout.
        uses: zeistapp/milo@main
        with:
          action: ${{ inputs.action }}
          category: ${{ inputs.category }}
          period: ${{ inputs.period }}
          repo: ${{ inputs.repo }}
          number: ${{ inputs.number }}
          config: ${{ inputs.config }}
          self-repo: ${{ inputs.include-self && github.repository || '' }}
          apply: "true"
          claude-version: ${{ steps.preflight.outputs.claude-version }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.MILO_GITHUB_TOKEN }}
          MILO_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
