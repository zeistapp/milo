name: Maintenance runner
on:
  workflow_call:
    inputs:
      action:
        type: string
        default: task
      category:
        type: string
        default: ''
      period:
        type: string
        default: week
      repo:
        type: string
        default: ''
      number:
        type: string
        default: ''
      config:
        type: string
        default: milo.config.json
      include-self:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  run:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: maintenance
    concurrency:
      group: milo-${{ github.repository }}-${{ contains(fromJSON('["reviews","review","revise"]'), inputs.action) && 'reviews' || inputs.category || inputs.action }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate maintenance credentials and pinned agent version
        env:
          CODEX_VERSION: ${{ vars.CODEX_VERSION }}
          CLAUDE_VERSION: ${{ vars.CLAUDE_VERSION }}
          MILO_GITHUB_TOKEN: ${{ secrets.MILO_GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$CODEX_VERSION$CLAUDE_VERSION" || { echo 'Set CODEX_VERSION or CLAUDE_VERSION for the configured provider'; exit 1; }
          test -n "$MILO_GITHUB_TOKEN" || { echo 'Add MILO_GITHUB_TOKEN to the maintenance environment'; exit 1; }
          if [ -n "$CLAUDE_VERSION" ]; then
            test -n "$ANTHROPIC_API_KEY" || { echo 'Add ANTHROPIC_API_KEY to the maintenance environment'; exit 1; }
          fi
          if [ -n "$CODEX_VERSION" ]; then
            test -n "$OPENAI_API_KEY" || { echo 'Add OPENAI_API_KEY to the maintenance environment'; exit 1; }
          fi
      - name: Run Milo
        uses: ./
        with:
          action: ${{ inputs.action }}
          category: ${{ inputs.category }}
          period: ${{ inputs.period }}
          repo: ${{ inputs.repo }}
          number: ${{ inputs.number }}
          config: ${{ inputs.config }}
          self-repo: ${{ inputs.include-self && github.repository || '' }}
          apply: 'true'
          codex-version: ${{ vars.CODEX_VERSION }}
          claude-version: ${{ vars.CLAUDE_VERSION }}
        env:
          GH_TOKEN: ${{ secrets.MILO_GITHUB_TOKEN }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
