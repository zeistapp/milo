name: Maintenance runner
on:
  workflow_call:
    inputs:
      action:
        type: string
        default: task
      category:
        type: string
        default: ''
      period:
        type: string
        default: week
      repo:
        type: string
        default: ''
      number:
        type: string
        default: ''
      config:
        type: string
        default: milo.config.json
      include-self:
        type: boolean
        default: true
    secrets:
      MILO_GITHUB_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
permissions:
  contents: read
jobs:
  run:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: maintenance
    concurrency:
      group: milo-${{ github.repository }}-${{ contains(fromJSON('["reviews","review","revise"]'), inputs.action) && 'reviews' || inputs.category || inputs.action }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate credentials and agent version for the configured provider
        id: preflight
        env:
          CONFIG: ${{ inputs.config }}
          # Live-verified Claude Code release; set CLAUDE_VERSION to pin your own.
          DEFAULT_CLAUDE_VERSION: '2.1.296'
          CODEX_VERSION: ${{ vars.CODEX_VERSION }}
          CLAUDE_VERSION: ${{ vars.CLAUDE_VERSION }}
          MILO_GITHUB_TOKEN: ${{ secrets.MILO_GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          provider=$(jq -r '.agent.provider // "custom"' "$CONFIG") || { echo "Cannot read agent.provider from $CONFIG"; exit 1; }
          test -n "$MILO_GITHUB_TOKEN" || { echo 'Add MILO_GITHUB_TOKEN to the maintenance environment and pass it from milo.yml'; exit 1; }
          case "$provider" in
            claude)
              test -n "$ANTHROPIC_API_KEY" || { echo 'Add ANTHROPIC_API_KEY to the maintenance environment'; exit 1; }
              echo "claude-version=${CLAUDE_VERSION:-$DEFAULT_CLAUDE_VERSION}" >> "$GITHUB_OUTPUT" ;;
            codex)
              test -n "$CODEX_VERSION" || { echo 'Set CODEX_VERSION in the maintenance environment'; exit 1; }
              test -n "$OPENAI_API_KEY" || { echo 'Add OPENAI_API_KEY to the maintenance environment'; exit 1; }
              echo "codex-version=$CODEX_VERSION" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Run Milo
        # Published action, so consumers calling this workflow run Milo rather than their own checkout.
        uses: zeistapp/milo@main
        with:
          action: ${{ inputs.action }}
          category: ${{ inputs.category }}
          period: ${{ inputs.period }}
          repo: ${{ inputs.repo }}
          number: ${{ inputs.number }}
          config: ${{ inputs.config }}
          self-repo: ${{ inputs.include-self && github.repository || '' }}
          apply: 'true'
          codex-version: ${{ steps.preflight.outputs.codex-version }}
          claude-version: ${{ steps.preflight.outputs.claude-version }}
        env:
          GH_TOKEN: ${{ secrets.MILO_GITHUB_TOKEN }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
