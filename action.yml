name: Milo
description: Ticket-driven maintenance and reviews for JavaScript and TypeScript repositories
inputs:
  config:
    description: Configuration path in the caller's checked-out repository
    default: milo.config.json
  action:
    description: validate, check, plan, task, reviews, work, review, revise, or tick
    default: tick
  repo:
    description: Configured owner/repository (required for numbered actions)
  number:
    description: Issue or PR number for work, review, or revise
  apply:
    description: Open issues for scan findings when action is plan
    default: 'false'
  claude-version:
    description: Exact Claude Code version to install (2.1.296+); omit when supplying an agent yourself
  category:
    description: Maintenance category for a dedicated task runner
  period:
    description: Scan deduplication period, day, week, or month
    default: week
  self-repo:
    description: Add this owner/repository to the maintenance targets
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: '1.4.3'
    # Milo's runtime dependencies, pinned by the lockfile shipped with this action.
    - name: Install Milo
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install --frozen-lockfile --production --ignore-scripts
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
    - name: Enable pnpm and Yarn
      shell: bash
      run: |
        corepack enable
        echo COREPACK_ENABLE_DOWNLOAD_PROMPT=0 >> "$GITHUB_ENV"
    # Sandboxed steps cannot use sudo, so Milo installs a repo's systemPackages with apt-get, outside the
    # sandbox, just before that repo's first setup step. Most runs never set up a repo and skip the install.
    # A slow apt mirror once took 25 minutes to send 64 MB, so the .deb files are cached per runner image.
    # apt checks each cached file against the signed index and downloads any that don't match.
    - name: Prepare system packages
      id: apt
      shell: bash
      env:
        MILO_ACTION_PATH: ${{ github.action_path }}
        INPUT_CONFIG: ${{ inputs.config }}
      run: |
        packages=$(bun "$MILO_ACTION_PATH/src/cli.ts" --config "$INPUT_CONFIG" packages)
        if [ "$RUNNER_OS" != 'Linux' ]; then
          test -z "$packages" || echo '::warning::systemPackages are installed only on Linux runners'
          exit 0
        fi
        mkdir -p "$RUNNER_TEMP/milo-apt"
        echo "prefix=milo-apt-$ImageOS-$ImageVersion-$RUNNER_ARCH-" >> "$GITHUB_OUTPUT"
    - id: restore
      if: steps.apt.outputs.prefix
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/milo-apt/*.deb
        key: ${{ steps.apt.outputs.prefix }}
        restore-keys: ${{ steps.apt.outputs.prefix }}
    # Setup and check steps run under bubblewrap; the Claude adapter's shell sandbox also needs socat.
    - name: Install sandbox
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes -o Dir::Cache::Archives="$RUNNER_TEMP/milo-apt" bubblewrap socat
        if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = '1' ] && [ ! -e /etc/apparmor.d/bwrap ]; then
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' 'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '}' | sudo tee /etc/apparmor.d/bwrap >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
        fi
    # CI for the caller's repo: lint its workflows, then run its configured setup and checks below.
    - name: Check GitHub Actions workflows
      if: inputs.action == 'check' && runner.os == 'Linux'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/actionlint.sh"'
    - name: Install Claude Code
      if: inputs.claude-version != ''
      shell: bash
      env:
        CLAUDE_VERSION: ${{ inputs.claude-version }}
      run: |
        [[ "$CLAUDE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'claude-version must be an exact release version'; exit 1; }
        npm install --global "@anthropic-ai/claude-code@$CLAUDE_VERSION"
    - name: Run Milo
      shell: bash
      env:
        MILO_ACTION_PATH: ${{ github.action_path }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_ACTION: ${{ inputs.action }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_NUMBER: ${{ inputs.number }}
        INPUT_APPLY: ${{ inputs.apply }}
        INPUT_CATEGORY: ${{ inputs.category }}
        INPUT_PERIOD: ${{ inputs.period }}
        INPUT_SELF_REPO: ${{ inputs.self-repo }}
        MILO_LOG_DIR: ${{ github.event.repository.private && format('{0}/milo-logs', runner.temp) || '' }}
        MILO_APT_ARCHIVES: ${{ steps.apt.outputs.prefix && format('{0}/milo-apt', runner.temp) || '' }}
      run: |
        if [ "$RUNNER_OS" = 'Windows' ]; then echo 'Milo currently supports Linux and macOS runners'; exit 1; fi
        args=(--config "$INPUT_CONFIG")
        if [ -n "$INPUT_REPO" ]; then args+=(--repo "$INPUT_REPO"); fi
        if [ -n "$INPUT_CATEGORY" ] && [[ "$INPUT_ACTION" =~ ^(task|plan|work)$ ]]; then args+=(--category "$INPUT_CATEGORY"); fi
        if [ -n "$INPUT_PERIOD" ]; then args+=(--period "$INPUT_PERIOD"); fi
        if [ -n "$INPUT_SELF_REPO" ]; then args+=(--self-repo "$INPUT_SELF_REPO"); fi
        case "$INPUT_ACTION" in
          validate|tick|reviews|task) args+=("$INPUT_ACTION") ;;
          check)
            if [ -z "$INPUT_REPO" ]; then args+=(--repo "$GITHUB_REPOSITORY"); fi
            args+=(check --report-dir "${MILO_LOG_DIR:-$RUNNER_TEMP/milo-check}") ;;
          plan)
            args+=(plan)
            if [ "$INPUT_APPLY" = 'true' ]; then args+=(--apply); fi ;;
          work|review|revise)
            [[ "$INPUT_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'A positive issue/PR number is required'; exit 1; }
            test -n "$INPUT_REPO" || { echo 'repo is required'; exit 1; }
            args+=("$INPUT_ACTION" "$INPUT_NUMBER") ;;
          *) echo 'Unknown Milo action'; exit 1 ;;
        esac
        bun "$MILO_ACTION_PATH/src/cli.ts" "${args[@]}"
    # Keyed by the cached file names, so a run that downloaded nothing new saves nothing.
    - name: Name the saved package cache
      id: saved
      if: ${{ !cancelled() && steps.apt.outputs.prefix }}
      shell: bash
      env:
        PREFIX: ${{ steps.apt.outputs.prefix }}
      run: echo "key=$PREFIX$(find "$RUNNER_TEMP/milo-apt" -maxdepth 1 -name '*.deb' -printf '%f\n' | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - if: ${{ !cancelled() && steps.saved.outputs.key != steps.restore.outputs.cache-matched-key }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/milo-apt/*.deb
        key: ${{ steps.saved.outputs.key }}
    # Private repos only: logs hold step output and agent reports, and a public repo's artifacts are readable by anyone.
    - name: Keep logs from a failed run
      if: failure() && github.event.repository.private
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: milo-logs-${{ inputs.action }}${{ inputs.category && format('-{0}', inputs.category) || '' }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/milo-logs/
        retention-days: 3
        if-no-files-found: ignore
